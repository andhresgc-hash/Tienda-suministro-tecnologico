<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda De Tecnologia</title>
    <link rel="stylesheet" href="./css/styles.css">
    
</head>
<body>
    <header>
<h1>Tienda de Tecnologia</h1>
<div class="cart-sumary-badge" id="cart-badge">0 unidades</div>
</header>

<main>
    <div id="status-container" role="status" aria-live="polite"></div>
    <section class="filters-section">
    <label for="search-input">Buscar productos</label>
    <input type="text" id="search-input" placeholder="Nombre o descripción">
    <label for="category-select">Categoría</label>
    <select id="category-select">
        <option value="">todas las categorias</option>
    </select>
    <label>
        <input type="checkbox" id="only-available">
        Solo disponibles
    </label>
    <label for="sort-select">Ordenar por precio</label>
    <select id="sort-select">
    <option value="">Sin ordenar</option>
    <option value="asc">Precio: menor a mayor</option>
    <option value="desc">Precio: mayor a menor</option>
    </select>

    <button id="clear-filters-btn" class="btn-secondary">limpiar filtros</button>
    </section>
    
    <section class="layout-grid"> 
        
        <section>
            <product-list></product-list>
        </section>

        <aside>
            <shopping-cart></shopping-cart>
        </aside>
        </section>     
</main>
    <script type="module" src="./js/app.js"></script>
  

</body>
</html>
